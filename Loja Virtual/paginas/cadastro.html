<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="icon" type="image/png" href="../fotos/icone.png"> 
    <link rel="stylesheet" href="../Css's/cadastrocss.css">


</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Criar conta</h1>

            <p class="subtitle">Crie sua conta</p>

            <form id="cadastroForm">

                <!-- E-mail -->
                <div class="input-group">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                    >
                </div>


                <!-- Senha -->
                <div class="input-group">
                    <label for="senha">Senha</label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                        >

                        <button
                            type="button"
                            class="mostrarSenha"
                            data-target="senha"
                        >
                            👁
                        </button>

                    </div>
                </div>


                <div class="input-group">
                    <label for="confirmarSenha">Confirmar senha</label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="confirmarSenha"
                            placeholder="Digite sua senha novamente"
                        >

                        <button
                            type="button"
                            class="mostrarSenha"
                            data-target="confirmarSenha"
                        >
                            👁
                        </button>

                    </div>
                </div>

                <p id="mensagem"></p>

                <button type="submit" class="btn-login">
                    Criar conta
                </button>
                
                <button
                    type="button"
                    class="btn-visitante"
                    onclick="window.location.href='inicio.html'"
                >
                    Continuar sem login
                </button>
            </form>


            <p class="cadastro">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../Js/supabase.js"></script>
    <script src="../Js/cadastroscript.js"></script>

</body>

</html>
