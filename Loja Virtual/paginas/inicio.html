</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="inicio.html" class="logo">
            EcoPerfumes
        </a>

        <ul class="nav-links">

            <li>
                <a href="inicio.html">

            <li>

                    Perfil

        </ul>

    </nav>


    <!-- BANNER -->

    <section class="banner">

        <img
            src="../fotos/banner2.png"
            alt="Promoção de perfumes"
        >

    </section>


    <!-- PRODUTOS -->

    <div id="produtos"></div>

    <!-- Aviso de produto adicionado -->
    <div id="toast" class="toast-carrinho">Produto adicionado ao carrinho!</div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../Js/supabase.js"></script>
    <script src="../Js/carrinho-auth.js"></script>

    <script>

        const items = [

            {
                id: 0,
                marca: 'Boticário',
                nome: 'Malbec Gold 100ml',
                img: '../fotos/malbecgold.jpg',
                preco: 'R$ 259,90'
            },

            {
                id: 1,
                marca: 'Boticário',
                nome: 'EGEO Blue 90ml',
                img: '../fotos/EgeoBlue.jpg',
                preco: 'R$ 164,90'
            },

            {
                id: 2,
                marca: 'Dior',
                nome: 'Sauvage 100ml',
                img: '../fotos/sauvage.jpg',
                preco: 'R$ 869,00'
            },

            {
                id: 3,
                marca: 'Carolina Herrera',
                nome: 'Carolina Herrera 50ml',
                img: '../fotos/CarolinaHerrera.jpg',
                preco: 'R$ 699,00'
            },

            {
                id: 4,
                marca: 'Carolina Herrera',
                nome: '212 Vip Carolina Herrera Feminino 50ml',
                img: '../fotos/212VipCarolinaHerreraFeminino.jpg',
                preco: 'R$ 353,70'
            },

            {
                id: 5,
                marca: 'Prada',
                nome: 'Perfume Feminino Prada Paradoxe Virtual Flower Eau de Parfum 30ml',
                img: '../fotos/PradaParadoxoFeminino.jpg',
                preco: 'R$ 558,52'
            }

        ];


        const produtos = document.getElementById('produtos');


        items.forEach((produto) => {

            produtos.innerHTML += `

                <div class="produto">

                    <img
                        src="${produto.img}"
                        alt="${produto.nome}"
                    >

                    <div class="marca">
                        ${produto.marca}
                    </div>

                    <div class="nome">
                        ${produto.nome}
                    </div>

                    <div class="preco">
                        ${produto.preco}
                    </div>

                    <button
                        class="btn-carrinho"
                        onclick="adicionarCarrinho(${produto.id})"
                    >
                        🛒
                    </button>

                </div>

            `;

        });


        // -----------------------------
        // Integração com o carrinho (localStorage)
        // -----------------------------

        function obterCarrinho() {
            const dados = localStorage.getItem('carrinho');
            return dados ? JSON.parse(dados) : [];
        }

        function salvarCarrinho(carrinho) {
            localStorage.setItem('carrinho', JSON.stringify(carrinho));
        }

        // Agora protegida: só adiciona se o usuário estiver logado
        function adicionarCarrinho(id) {

            protegerAcaoCarrinho(() => {

                const produto = items.find(
                    item => item.id === id
                );

                if (!produto) return;

                let carrinho = obterCarrinho();

                const existente = carrinho.find(item => item.id === id);

                if (existente) {
                    existente.quantidade += 1;
                } else {
                    carrinho.push({ ...produto, quantidade: 1 });
                }

                salvarCarrinho(carrinho);

                console.log('Produto adicionado:', produto.nome);
                mostrarToast();

            });

        }

        function mostrarToast() {

            const toast = document.getElementById('toast');
            toast.classList.add('mostrar');

            clearTimeout(window._toastTimeout);
            window._toastTimeout = setTimeout(() => {
                toast.classList.remove('mostrar');
            }, 2000);

        }

    </script>

</body>

</html>
