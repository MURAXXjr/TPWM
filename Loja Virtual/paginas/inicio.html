<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoPerfumes</title>

    <link rel="icon" type="image/png" href="../fotos/icone.png"> 
    <link rel="stylesheet" href="../Css's/inicio.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="inicio.html" class="logo">
            EcoPerfumes
        </a>

        <ul class="nav-links">

            <li>
                <a href="inicio.html">
                    Início
                </a>
            </li>

            <li>
                <a href="PerfumesM.html">
                    Perfumes Masculinos
                </a>
            </li>

            <li>
                <a href="PerfumesF.html">
                    Perfumes Femininos
                </a>
            </li>

            <li>
                <a href="#">
                    Carrinho
                </a>
            </li>

            <li>
                <a href="Sobre.html">
                    Sobre
                </a>
            </li>

        </ul>

    </nav>


    <!-- BANNER -->

    <section class="banner">

        <img
            src="../fotos/banner2.png"
            alt="Promoção de perfumes"
        >

    </section>


    <!-- PRODUTOS -->

    <div id="produtos"></div>


    <script>

        const items = [

            {
                id: 0,
                marca: 'Boticário',
                nome: 'Malbec Gold 100ml',
                img: '../fotos/malbecgold.jpg',
                preco: 'R$ 259,90'
            },

            {
                id: 1,
                marca: 'Boticário',
                nome: 'EGEO Blue 90ml',
                img: '../fotos/EgeoBlue.jpg',
                preco: 'R$ 164,90'
            },

            {
                id: 2,
                marca: 'Dior',
                nome: 'Sauvage 100ml',
                img: '../fotos/sauvage.jpg',
                preco: 'R$ 869,00'
            },

            {
                id: 3,
                marca: 'Carolina Herrera',
                nome: 'Carolina Herrera 50ml',
                img: '../fotos/CarolinaHerrera.jpg',
                preco: 'R$ 699,00'
            },

            {
                id: 4,
                marca: 'Carolina Herrera',
                nome: '212 Vip Carolina Herrera Feminino 50ml',
                img: '../fotos/212VipCarolinaHerreraFeminino.jpg',
                preco: 'R$ 353,70'
            },

            {
                id: 5,
                marca: 'Prada',
                nome: 'Perfume Feminino Prada Paradoxe Virtual Flower Eau de Parfum 30ml',
                img: '../fotos/PradaParadoxoFeminino.jpg',
                preco: 'R$ 558,52'
            }

        ];


        const produtos = document.getElementById('produtos');


        items.forEach((produto) => {

            produtos.innerHTML += `

                <div class="produto">

                    <img
                        src="${produto.img}"
                        alt="${produto.nome}"
                    >

                    <div class="marca">
                        ${produto.marca}
                    </div>

                    <div class="nome">
                        ${produto.nome}
                    </div>

                    <div class="preco">
                        ${produto.preco}
                    </div>

                    <button
                        class="btn-carrinho"
                        onclick="adicionarCarrinho(${produto.id})"
                    >
                        🛒
                    </button>

                </div>

            `;

        });


        function adicionarCarrinho(id) {

            const produto = items.find(
                item => item.id === id
            );

            console.log(
                'Produto adicionado:',
                produto.nome
            );

        }

    </script>

</body>

</html>
