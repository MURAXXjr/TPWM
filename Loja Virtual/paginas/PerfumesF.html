            },

            {
                id: 27,

                preco: "R$ 199,90"
            },

            {
                id: 28,

                preco: "R$ 179,90"
            },

            {
                id: 29,
                marca: "Lancôme",
                nome: "La Vie Est Belle 75ml",
                img: "../fotos/lacome.jpg",
                preco: "R$ 699,90"
            },

            {
                id: 30,
                marca: "Carolina Herrera",
                nome: "Good Girl 80ml",
                img: "../fotos/goodgirl.jpg",
                preco: "R$ 799,90"
            },

            {
                id: 31,
                marca: "Paco Rabanne",
                nome: "Lady Million 80ml",
                img: "../fotos/ladymillion.jpg",
                preco: "R$ 649,90"
            },

            {
                id: 32,
                marca: "Dior",
                nome: "Jadore 100ml",
                img: "../fotos/jadore.png",
                preco: "R$ 899,90"
            }

        ];

        const produtos = document.getElementById("produtos");

        perfumesF.forEach((produto) => {

            produtos.innerHTML += `

                <div class="produto">

                    <img
                        src="${produto.img}"
                        alt="${produto.nome}"
                    >

                    <div class="marca">
                        ${produto.marca}
                    </div>

                    <div class="nome">
                        ${produto.nome}
                    </div>

                    <div class="preco">
                        ${produto.preco}
                    </div>

                    <button
                        class="btn-carrinho"
                        onclick="adicionarCarrinho(${produto.id})"
                    >
                        🛒
                    </button>

                </div>

            `;

        });

        // Integração com o carrinho (localStorage)
        function obterCarrinho() {
            const dados = localStorage.getItem('carrinho');
            return dados ? JSON.parse(dados) : [];
        }

        function salvarCarrinho(carrinho) {
            localStorage.setItem('carrinho', JSON.stringify(carrinho));
        }

        // Agora protegida: só adiciona se o usuário estiver logado
        function adicionarCarrinho(id) {

            protegerAcaoCarrinho(() => {

                const produto = perfumesF.find(
                    item => item.id === id
                );

                if (!produto) return;

                let carrinho = obterCarrinho();

                const existente = carrinho.find(item => item.id === id);

                if (existente) {
                    existente.quantidade += 1;
                } else {
                    carrinho.push({ ...produto, quantidade: 1 });
                }

                salvarCarrinho(carrinho);

                console.log("Produto adicionado:", produto.nome);
                mostrarToast();

            });

        }

        function mostrarToast() {

            const toast = document.getElementById('toast');
            toast.classList.add('mostrar');

            clearTimeout(window._toastTimeout);
            window._toastTimeout = setTimeout(() => {
                toast.classList.remove('mostrar');
            }, 2000);

        }

    </script>

    <script src="../Js/navbar.js"></script>
