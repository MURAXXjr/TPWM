        const produtos = document.getElementById("produtos");

        perfumes.forEach((produto) => {

            produtos.innerHTML += `

                <div class="produto">

                    <img
                        src="${produto.img}"
                        alt="${produto.nome}"
                    >

                    <div class="marca">
                        ${produto.marca}
                    </div>

                    <div class="nome">
                        ${produto.nome}
                    </div>

                    <div class="preco">
                        ${produto.preco}
                    </div>

                    <button
                        class="btn-carrinho"
                        onclick="adicionarCarrinho(${produto.id})"
                    >
                        🛒
                    </button>

                </div>

            `;

        });


        // -----------------------------
        // Integração com o carrinho (localStorage)
        // -----------------------------

        function obterCarrinho() {
            const dados = localStorage.getItem('carrinho');
            return dados ? JSON.parse(dados) : [];
        }

        function salvarCarrinho(carrinho) {
            localStorage.setItem('carrinho', JSON.stringify(carrinho));
        }

        // Agora protegida: só adiciona se o usuário estiver logado
        function adicionarCarrinho(id) {

            protegerAcaoCarrinho(() => {

                const produto = perfumes.find(
                    item => item.id === id
                );

                if (!produto) return;

                let carrinho = obterCarrinho();

                const existente = carrinho.find(item => item.id === id);

                if (existente) {
                    existente.quantidade += 1;
                } else {
                    carrinho.push({ ...produto, quantidade: 1 });
                }

                salvarCarrinho(carrinho);

                console.log("Produto adicionado:", produto.nome);
                mostrarToast();

            });

        }

        function mostrarToast() {

            const toast = document.getElementById('toast');
            toast.classList.add('mostrar');

            clearTimeout(window._toastTimeout);
            window._toastTimeout = setTimeout(() => {
                toast.classList.remove('mostrar');
            }, 2000);

        }

    </script>
